name: Windows offline validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned development tools
        run: python -m pip install --target tools/build-runtime -r requirements-dev.txt
      - name: Bootstrap, build and CTest (no AC/CSP installation)
        run: ./scripts/build_m1.ps1 -Configuration '${{ matrix.configuration }}'
      - name: Mocked LuaJIT bridge lifecycle, DSP and complementary FX policy
        run: ./scripts/test_bridge.ps1
      - name: Audit-tool unit tests
        run: python -m unittest discover -s tests -p test_audit_tools.py -v
      - name: Keep offline diagnostics (not in-game evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ matrix.configuration }}
          path: |
            build/Testing/Temporary/*.log
            build/audio-audit-test/metrics.csv
            build/m1-test/*.csv
            build/dynamic-gate.csv
            build/ignition-upstream/*.csv
            build/ignition-fixed/*.csv
          if-no-files-found: ignore
          retention-days: 14
